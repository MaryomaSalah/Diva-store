<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessories Collection - Diva Store</title>
    </head>
    <style>
*{
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}
body{
    background-color: #1e1e24;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
}
h1{
margin-bottom: 20px;
}
#status{
font-size: 1.2em;
margin-bottom: 15px;
color: #00adb5;
font-weight: bold;

}
/* لوحة الشطرنج */
.chessboard{
display: grid;
grid-template-columns: repeat(8, 65px);
grid-template-rows: repeat(8, 65px);
border: 4px solid #00adb5;
border-radius: 8px;
box-shadow: 0 10 30px rgba(0, 0, 0, 0.5);
overflow: hidden;
}
/* المربعات */
.square{
width: 65px;
height: 65px;
display: flex;
justify-content: center;
align-items: center;
font-size: 2.5rem;
cursor: pointer;
user-select: none;
transition: background-color 0.2s;
}
.square.white-square{
background-color: #eeeed2;
}
.square.black-square{
background-color: #769656;
}
.square:hover{
    opacity: 0.8;
}
button{
    margin-top: 20px;
    padding: 10px 25px;
    font-size: 1rem;
    background-color: #00adb5;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}
button:hover{
    background-color: #00888e;
}
        </style>
      </head>
<body>  
<h1>Chess Game</h1>
<div id="status">White's turn</div>
<div class="chessboard" id="chessboard"></div>
<button id="resetButton">Reset Game</button>
<script>
    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');

const pieces = {
      r: '♜', n: '♞', b: '♝', q: '♛', k: '♚', p: '♟', // أسود
      R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔', P: '♙'  // أبيض
    };

const initialBoard = [
      ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
      ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
      ['', '', '', '', '', '', '', ''],
      ['', '', '', '', '', '', '', ''],
      ['', '', '', '', '', '', '', ''],
      ['', '', '', '', '', '', '', ''],
      ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
      ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
    ];

    let boardState = [];
    let selectedSquare = null;
    let currentPlayer = 'white';

    function intiBoard(){
    boardState = JSON.parse(JSON.stringify(initialBoard));
    currentPlayer = 'white';
    selectedSquare = null;
    updateStatus();
    render();
    }

    function render(){
        boardElement.innerHTML = '';
        for(let row = 0; row < 8; row++){
            for(let col = 0; col < 8; col++){
                const square = document.createElement('div');
                square.classList.add('square');
                square.classList.add((row + col) % 2 === 0 ? 'white-square' : 'black-square');
                square.dataset.row = row;
                square.dataset.col = col;
                const piece = boardState[row][col];
                if(piece){
                    square.textContent = pieces[piece];
                }
                square.addEventListener('click', onSquareClick);
                boardElement.appendChild(square);
            }
        }
    }

    function onSquareClick(event){
        const row = parseInt(event.currentTarget.dataset.row);
        const col = parseInt(event.currentTarget.dataset.col);
        const piece = boardState[row][col];

        if(selectedSquare){
            const [selectedRow, selectedCol] = selectedSquare;
            if(isValidMove(selectedRow, selectedCol, row, col)){
                boardState[row][col] = boardState[selectedRow][selectedCol];
                boardState[selectedRow][selectedCol] = '';
                selectedSquare = null;
                currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
                updateStatus();
                render();
            } else {
                selectedSquare = null;
            }
        } else {
            if(piece && ((currentPlayer === 'white' && piece === piece.toUpperCase()) || (currentPlayer === 'black' && piece === piece.toLowerCase()))){
                selectedSquare = [row, col];
            }
        }
    }

    function updateStatus(){
        statusElement.textContent = currentPlayer === 'white' ? "White's turn" : "Black's turn";
    }
    function resetGame(){
        intiBoard();
    }
intiBoard();
</script>

</body>
</html>
