<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creat Account _ Diva Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fffafa;
            font-family: 'Segoe UI', sans-serif;
        }

        .header {
            background-color: #ffb6c1;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            color: #4a4a4a;
            font-size: 26px;
        }

        .form-container {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-container h2 {
            color: 4a4a4a;
            text-align: center;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #666;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffe4e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #ff6b81;
        }

        .error {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .btn-submit {
            background-color: #ff6b81;
            color: white;
            border: none;
            padding: 14PX;
            width: 100%;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit :hover {
            background-color: #ff4757;
        }
        @media (max-width:768px){
            .jj, .header{
                padding:15px !important;

            }
            nav {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            nav a{
                display: block;
                width: 80%;
                text-align: center;
                margin: 5px 0 !important;
                font-size: 15px;
            }
            .products-container,
            .products-grid, .grid{
                display: grid;
                grid-template-columns: 1fr
                !important ;
                gap:20px !important;
                padding: 10px !important;

                
            }
            .product-card,.item{
                width: 100% !important;
                box-sizing: border-box;
                margin: 0 auto 
                !important;
            }
            footer {
                padding: 20px 10px
                !important;
                font-size: 14px;

            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>✨ Diva Store ✨</h1>
        <div class="form-container">
            <h2>Create Account</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="username" placeholder=" Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email Address </label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="Password" placeholder="Create a password" required>
                    <div class=" error" id="passError">Password must be at least 6 characters!</div>
                </div>
                <button type="submit" class="btn-submit">Sign Up</button>
            </form>
        </div>
        <script>
            document.getElementById('signupForm').addEventListener('submit', function (e) {
                e.preventDefault();
                const name = document.getElementById('username').value.trim();
                const email = document.getElementById('email').value.trim();
                const pass = document.getElementById('password').value;
                if (pass.length < 6) {
                    document.getElementById('passError').style.display = 'block';
                    return;
                }
                localStorage.setItem('diva_user_name', name);
                localStorage.setItem('diva_user_email', email);
                alert("🎉 Account created successfully!");
                window.location.href = "profile.html";
            });
        </script>

</body>

</html>
