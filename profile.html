<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Diva Store</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fffafa;
            font-family: 'Segoe UI', sans-serif;
        }

        .jj {
            background-color: #ffb6c1;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #4a4a4a;
            margin-bottom: 10px;
        }

        nav a {
            color: #4a4a4a;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }

        nav a:hover {
            color: white;
            background-color: #ff6b81;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .profile-container {
            max-width: 500px;
            margin: 5px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            margin-top: 40px;
        }

        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffb6c1;
            background-color: #ffe4e1;
        }

        .upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: #ff6b81;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        .upload-btn:hover {
            background-color: #ff4757;
            transform: scale(1.1);
        }

        .profile-container h2 {
            color: #4a4a4a;
            margin-bottom: 5px;
            font-size: 24px;
            display: inline-block;
        }

        .edit-name-btn {
            background: none;
            border: none;
            color: #ff6b81;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
        }

        .profile-container p {
            color: #777;
            margin-top: 0;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .btn-logout {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.2);
        }

        .btn-logout:hover {
            background-color: #ff2a3b;
        }

        @media (max-width: 600px) {
            nav a {
                display: block;
                margin: 10px 0;
            }
            .profile-container {
                width: 90%;
                padding: 20px;
            }
        }
        @media(max-width:768px)
        {
            .jj,header {
                padding: 15px !important;
            }
            nav{
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            nav a {
                display: block;
                width: 80%;
                text-align: center;
                margin: 5px 0 !important;
                font-size: 15px;
            }
       
             .products-container,
              .products-grid, .grid{
                    display: grid;
                    grid-template-columns: 1fr
                    !important;
                    gap: 20px !important;
                    padding: 10px !important;

        }
        
.product-card, .item {
    width: 100% 
    !important;
    box-sizing: border-box;
    margin: 0 auto !important;
        }
        footer{
            padding: 20px 10px
            !important;
            font-size: 14px;
        }
    }
    </style>
</head>

            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <button class="upload-btn" onclick="document.getElementById('image-input').click()">📷</button>
        </div>

        <div>
            <h2 id="profile-name">Maryoma Salah</h2>
            <button class="edit-name-btn" id="edit-btn">✏️ Edit</button>
        </div>
        <p>Premium Diva Member</p>

        <button class="btn-logout" id="logout-btn">Log Out</button>
    </div>

    <script>
        const profileName = document.getElementById('profile-name');
        const editBtn = document.getElementById('edit-btn');
        const imageInput = document.getElementById('image-input');
        const profilePic = document.getElementById('profile-pic');
        const logoutBtn = document.getElementById('logout-btn');

        if (localStorage.getItem('username')) {
            profileName.textContent = localStorage.getItem('username');
        }
        if (localStorage.getItem('userimage')) {
            profilePic.src = localStorage.getItem('userimage');
        }

        editBtn.addEventListener('click', () => {
            const newName = prompt("Enter your new profile name:", profileName.textContent);
            if (newName && newName.trim() !== "") {
                profileName.textContent = newName;
                localStorage.setItem('username', newName);
            }
        });

        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    profilePic.src = e.target.result;
                    localStorage.setItem('userimage', e.target.result);
                }
                reader.readAsDataURL(file);
            }
        });

        logoutBtn.addEventListener('click', () => {
            if (confirm("Are you sure you want to Log Out from Diva Store?")) {
                localStorage.removeItem('username');
                localStorage.removeItem('userimage');
                window.location.href = 'index.html';
            }
        });
    </script>
