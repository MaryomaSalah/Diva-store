    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fffafa;
            font-family: 'Segoe UI', sans-serif;
        }

        .jj {
            background-color: #ffb6c1;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #4a4a4a;
            margin-bottom: 10px;
        }

        nav a {
            color: #4a4a4a;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }

        nav a:hover {
            color: white;
            background-color: #ff6b81;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .profile-container {
            max-width: 500px;
            margin: 5px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgb(0, 0, 0, 0, 08);
            text-align: center;
            margin-top: 40px;

        }

        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffb6c1;
            background-color: #ffe4e1;
            /* width: 120px; height: 120px; background-color: #ffe4e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 50px; color: #ff6b81; margin: 0 auto 20px ; border: 4px solid #ffb6c1; */
        }

        .upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: #ff6b81;
            color: white;
            border: none;
            width: 35PX;
            height: 35PX;
            border-radius: 50%;
            font-size: 18PX;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: 0.3s;

        }
        .upload-btn:hover {
            background-color: #ff4757;
            transform: scale(1.1);
        }
        .profile-container h2 {
            color: #4a4a4a;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .profile-container p {
            color: #777;
            margin-top: 0;
            font-weight: 16px;
            margin-bottom: 25px;
        }
        .btn-logout {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgb(255,71,87,0.2 );
        }
        .btn-logout:hover {
            background-color: #ff2a3b;

        }
    </style>
