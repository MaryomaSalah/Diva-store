<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diva Store | FAQ</title>
</head>
<style>
    body {
        background-color: #fafafa;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI','Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    }
    .header-section {
        background-color: #ffb3c1;
        padding: 30px 20px;
        text-align: center;
    }
    .header-section h1 {
        color: #4a4a4a;
        font-size: 36px;
        margin: 0 0 10px 0;
        font-weight: bold;
    } 
    .header-section p {
        color: #666;
        font-size: 16PX;
        margin: 0 0 20px 0;
    }
    .nav-linkes {
        display: flex;
        justify-content: center;
        gap: 25px;
    }
    .nav-linkes a {
        color: #4a4a4a;
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        transition: color 0.2s;
    }
    .nav-linkes a:hover, .nav-linkes a.active {
        color: #ffffff;
    }
    .fag-wrapper {
        max-width: 800px;
        margin: 50px auto;
        padding: 0 20px;
    }
    .fag-title {
        text-align: center;
        color: #ff7597;
        font-size: 28px;
        margin-bottom: 40px;
    }
    .fag-item {
        background-color: #ffffff;
        border: 1px solid #ffe5ec;
        border-radius: 10px;
        margin-bottom: 15px;
        padding: 20px;
        cursor: pointer;
        transition: transform 0.2s;
    }
     .fag-item:hover {
        transform: translateY(-2px);
     }
     .fag-question {
        font-size: 18px;
        font-weight: bold;
        color: #333;
        margin: 0;
        display: flex;
        justify-content: space-between;
     }
     .fag-answer {
        margin-top: 10px;
        color: #666;
        font-size: 15px;
        line-height: 1.6;
        display: none;
     }
     .footer-box {
        text-align: center;
        margin-top: 40px;
     }
     .back-home {
        color: #ff7597;
        text-decoration: none;
        font-weight: bold;
     }
</style>

</body>
</html>
